# Draws the snake that eats the contribution graph in the profile README. It runs once a day
# and on demand, and publishes the two SVGs (light and dark) to the `output` branch, which is
# where the README loads them from.
name: Snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#a92a4e&color_dots=#ebedf0,#f6c8d6,#dd6a90,#a92a4e,#5f1a30
            dist/snake-dark.svg?palette=github-dark&color_snake=#eb9db6&color_dots=#161b22,#5f1a30,#8c2242,#c94168,#eb9db6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
